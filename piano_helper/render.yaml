services:
  - type: web
    name: tcsmusic
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn pianohelper.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.0
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_SECRET_KEY
        generateValue: true
